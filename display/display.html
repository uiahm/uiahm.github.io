<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdBreakBox Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Venue display font. Put the licensed file in /fonts to self-host; the second source is the venue's own site. */
  @font-face {
    font-family: "Hill House";
    src: url("fonts/HillHouse.woff") format("woff"),
         url("https://s39888.pcdn.co/wp-content/uploads/2021/12/Hill_House.woff") format("woff");
    font-display: block;
  }
  :root { --accent:#84754E; --ink:#000; --paper:#fff; }
  html,body { margin:0; height:100%; overflow:hidden; background:transparent; }
  body.demo { background:#1b2a1b url("https://s39888.pcdn.co/wp-content/uploads/2022/02/Nelson_14.10.211786_web.jpg") center/cover; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }

  .bar { position:absolute; left:0; right:0; height:200px; display:flex; flex-direction:column;
         background:var(--ink); color:var(--paper); box-shadow:0 -8px 30px rgba(0,0,0,.45); }
  .bar.bottom { bottom:0; } .bar.top { top:0; flex-direction:column-reverse; }
  .rule { height:6px; background:linear-gradient(90deg,transparent 0,var(--accent) 12%,var(--accent) 88%,transparent 100%); }
  .main { flex:1; display:flex; align-items:center; padding:0 56px; gap:48px; }
  .logo { height:118px; width:auto; flex:none; }
  .divider { width:2px; align-self:stretch; margin:26px 0; background:var(--accent); flex:none; }
  .msg { flex:1; position:relative; height:100%; }
  .slide { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
           opacity:0; transform:translateY(18px); transition:opacity .7s ease, transform .7s ease; }
  .slide.on { opacity:1; transform:none; }
  .kicker { font-family:"Baskervville",serif; font-style:italic; font-size:30px; color:var(--accent);
            letter-spacing:.04em; margin-bottom:4px; }
  .kicker::before, .kicker::after { content:"⬥"; font-style:normal; font-size:20px; margin:0 14px; vertical-align:3px; }
  .kicker::before { margin-left:0; }
  .text { font-family:"Hill House","Baskervville",serif; font-size:64px; line-height:1.05; text-transform:uppercase;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .clock { flex:none; text-align:right; font-family:"Hill House","Baskervville",serif; font-size:60px; line-height:1; }
  .clock small { display:block; font-family:"Baskervville",serif; font-size:22px; color:var(--accent);
                 text-transform:uppercase; letter-spacing:.18em; margin-top:8px; }
  .ticker { height:46px; background:#151515; overflow:hidden; display:flex; align-items:center;
            font-family:"Baskervville",serif; font-size:24px; letter-spacing:.06em; color:rgba(255,255,255,.85); }
  .ticker span { white-space:nowrap; padding-left:100%; display:inline-block; animation:tick linear infinite; }
  @keyframes tick { from { transform:translateX(0); } to { transform:translateX(-100%); } }
  .err { position:absolute; left:40px; top:40px; color:#fff; background:#a00; font:20px sans-serif; padding:10px 16px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const venue = (params.get("venue") || "nelson-hotel").replace(/[^a-z0-9-]/gi, "");
  if (params.get("bg") === "demo") document.body.classList.add("demo");
  const stage = document.getElementById("stage");
  let data = null, idx = 0, timer = null, sig = "";

  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
    stage.style.left = (innerWidth - 1920 * s) / 2 + "px";
    stage.style.top = (innerHeight - 1080 * s) / 2 + "px";
  }
  addEventListener("resize", fit); fit();

  const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function render() {
    document.documentElement.style.setProperty("--accent", data.accent || "#84754E");
    const slides = (data.messages || []).map((m, i) =>
      '<div class="slide' + (i === 0 ? " on" : "") + '"><div class="kicker">' + esc(m.kicker) +
      '</div><div class="text">' + esc(m.text) + "</div></div>").join("");
    stage.innerHTML =
      '<div class="bar ' + (data.position === "top" ? "top" : "bottom") + '">' +
        '<div class="rule"></div>' +
        '<div class="main">' +
          (data.logo ? '<img class="logo" src="' + esc(data.logo) + '" alt="' + esc(data.venue) + '">' : "") +
          '<div class="divider"></div><div class="msg">' + slides + "</div>" +
          (data.showClock !== false ? '<div class="divider"></div><div class="clock" id="clock"></div>' : "") +
        "</div>" +
        (data.ticker ? '<div class="ticker"><span id="tick">' + esc(data.ticker) + "&nbsp;&nbsp;⬥&nbsp;&nbsp;</span></div>" : "") +
      "</div>";
    const t = document.getElementById("tick");
    if (t) t.style.animationDuration = Math.max(20, data.ticker.length / 4) + "s";
    idx = 0; clearInterval(timer);
    timer = setInterval(next, Math.max(3, +data.rotateSeconds || 9) * 1000);
    clock();
  }
  function next() {
    const s = stage.querySelectorAll(".slide"); if (s.length < 2) return;
    s[idx].classList.remove("on"); idx = (idx + 1) % s.length; s[idx].classList.add("on");
  }
  function clock() {
    const c = document.getElementById("clock"); if (!c) return;
    const now = new Date();
    const t = now.toLocaleTimeString("en-AU", { hour:"numeric", minute:"2-digit", hour12:true, timeZone:"Australia/Sydney" });
    const d = now.toLocaleDateString("en-AU", { weekday:"short", day:"2-digit", month:"2-digit", timeZone:"Australia/Sydney" });
    c.innerHTML = esc(t.replace(/\s/g, "").toUpperCase()) + "<small>" + esc(d) + "</small>";
  }
  setInterval(clock, 10000);

  async function load() {
    try {
      const r = await fetch("data/" + venue + ".json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const txt = await r.text();
      if (sig !== "editor" && txt !== sig) { sig = txt; data = JSON.parse(txt); render(); }
    } catch (e) {
      if (!data) stage.innerHTML = '<div class="err">Display data not found for "' + esc(venue) + '"</div>';
    }
  }
  if (params.get("preview") === "1") {
    // Admin live preview: render unsaved edits sent from the editor (same site only)
    addEventListener("message", e => {
      if (e.origin !== location.origin || !e.data || !e.data.abb) return;
      sig = "editor"; data = e.data.abb; render();
    });
    load();
  } else {
    load(); setInterval(load, 60000);  // picks up edits within a minute, no reload needed
  }
})();
</script>
</body>
</html>
