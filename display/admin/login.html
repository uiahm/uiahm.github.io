<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Log in ~ AdBreakBox</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div class="card narrow" style="max-width:380px">
<h1>AdBreakBox</h1><p class="note">Own your screen. Log in to manage venue displays.</p>
<p id="msg"></p>
<form id="f"><label>Password</label><input id="pw" type="password" autocomplete="current-password" autofocus required>
<p><button id="go">Log in</button></p></form>
</div></div>
<script src="abb.js"></script>
<script>
const $ = id => document.getElementById(id), msg = (t, ok) => $("msg").innerHTML = `<span class="${ok ? "ok" : "bad"}">${ABB.h(t)}</span>`;
if (ABB.session()) location.href = "index.html";
let auth = null, fails = 0;
fetch("auth.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(a => auth = a)
  .catch(() => location.href = "setup.html");
$("f").onsubmit = async e => {
  e.preventDefault(); if (!auth) return;
  if (fails >= 5) return msg("Too many attempts. Reload the page to try again.");
  $("go").disabled = true; msg("Checking…", true);
  try {
    const token = await ABB.decrypt(auth.token, $("pw").value);
    ABB.setSession({ owner: auth.owner, repo: auth.repo, branch: auth.branch, folder: auth.folder, token });
    location.href = "index.html";
  } catch { fails++; msg("Incorrect password."); $("go").disabled = false; }
};
</script></body></html>
