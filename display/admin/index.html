<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Displays ~ AdBreakBox</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<div class="top"><h1 style="margin:0">AdBreakBox ~ displays</h1><button class="ghost" onclick="ABB.logout()">Log out</button></div>
<label>Venue</label><select id="venue"></select>
<div class="card" style="margin-top:16px">
  <p id="msg"></p>
  <iframe id="preview" title="Preview"></iframe>
  <p class="note">Live preview of your unsaved changes. Screen URL: <a id="screen" target="_blank"></a><br>
  Add <code>&amp;bg=demo</code> for a photo background; leave it off for a transparent overlay.</p>
  <form id="f">
    <label>Banner messages (rotate in order; blank rows are ignored)</label><div id="rows"></div>
    <button type="button" class="ghost" id="add">+ Add message</button>
    <label>Scrolling ticker</label><textarea id="ticker" rows="2"></textarea>
    <div class="grid3">
      <div><label>Seconds per message</label><input id="rotateSeconds" type="number" min="3" max="60"></div>
      <div><label>Banner position</label><select id="position"><option value="bottom">Bottom</option><option value="top">Top</option></select></div>
      <div><label>Accent colour</label><input id="accent"></div>
    </div>
    <label>Venue name</label><input id="venueName">
    <label>Logo URL (white logo works best)</label><input id="logo">
    <label><input type="checkbox" id="showClock" style="width:auto"> Show clock</label>
    <p><button id="save">Save and publish</button></p>
  </form>
</div></div>
<script src="abb.js"></script>
<script>
const s = ABB.requireLogin();
const $ = id => document.getElementById(id), msg = (t, ok) => $("msg").innerHTML = `<span class="${ok ? "ok" : "bad"}">${ABB.h(t)}</span>`;
let sha = null, venue = null;

function addRow(m = { kicker: "", text: "" }) {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<input placeholder="Small heading" class="k"><input placeholder="Main banner text" class="t"><button type="button" class="ghost">✕</button>`;
  d.querySelector(".k").value = m.kicker || ""; d.querySelector(".t").value = m.text || "";
  d.querySelector("button").onclick = () => { d.remove(); push(); };
  $("rows").appendChild(d);
}
function collect() {
  const accent = /^#[0-9a-f]{6}$/i.test($("accent").value.trim()) ? $("accent").value.trim() : "#84754E";
  return {
    venue: $("venueName").value.trim(), logo: $("logo").value.trim(), accent,
    rotateSeconds: Math.max(3, Math.min(60, parseInt($("rotateSeconds").value) || 9)),
    position: $("position").value, showClock: $("showClock").checked,
    messages: [...document.querySelectorAll("#rows .row")].map(r => ({ kicker: r.querySelector(".k").value.trim(), text: r.querySelector(".t").value.trim() })).filter(m => m.text),
    ticker: $("ticker").value.trim()
  };
}
const push = () => $("preview").contentWindow?.postMessage({ abb: collect() }, location.origin);
function fill(d) {
  $("rows").innerHTML = ""; (d.messages || []).forEach(addRow); addRow();
  $("ticker").value = d.ticker || ""; $("rotateSeconds").value = d.rotateSeconds || 9;
  $("position").value = d.position === "top" ? "top" : "bottom"; $("accent").value = d.accent || "#84754E";
  $("venueName").value = d.venue || ""; $("logo").value = d.logo || ""; $("showClock").checked = d.showClock !== false;
}
async function load(v) {
  venue = v; msg("Loading…", true);
  try {
    const r = await ABB.readJson(s, `${s.folder}data/${v}.json`); sha = r.sha; fill(r.data);
    const url = `../display.html?venue=${encodeURIComponent(v)}`;
    $("screen").href = url; $("screen").textContent = new URL(url, location.href).href;
    $("preview").src = url + "&bg=demo&preview=1"; $("preview").onload = push;
    msg("");
  } catch (e) { if (e.status === 401) return ABB.logout(); msg(e.message); }
}
async function init() {
  try {
    const files = (await ABB.list(s, `${s.folder}data`)).filter(f => f.name.endsWith(".json")).map(f => f.name.slice(0, -5));
    $("venue").innerHTML = files.map(f => `<option>${ABB.h(f)}</option>`).join("");
    $("venue").onchange = () => load($("venue").value);
    if (files.length) load(files[0]);
  } catch (e) { if (e.status === 401) return ABB.logout(); msg(e.message); }
}
$("add").onclick = () => addRow();
$("f").oninput = push;
$("f").onsubmit = async e => {
  e.preventDefault(); $("save").disabled = true; msg("Saving…", true);
  try {
    const r = await ABB.writeFile(s, `${s.folder}data/${venue}.json`, JSON.stringify(collect(), null, 2) + "\n",
      `AdBreakBox: update ${venue} display`, sha);
    sha = r.content.sha;
    const t = new Date().toLocaleString("en-AU", { day: "2-digit", month: "2-digit", year: "numeric", hour: "numeric", minute: "2-digit", timeZone: "Australia/Sydney" });
    msg(`Saved ${t}. GitHub Pages publishes in about a minute, then screens pick it up within another minute.`, true);
  } catch (err) {
    msg(err.status === 409 ? "Someone else saved this venue since you opened it. Reload to get their changes." : err.message);
  }
  $("save").disabled = false;
};
init();
</script></body></html>
