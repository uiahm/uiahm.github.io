<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Set up ~ AdBreakBox</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div class="card narrow">
<h1>Set up AdBreakBox login</h1>
<p class="note">One-time setup. Paste a GitHub token that can write to your site's repo, then choose a password. The token is saved to the repo encrypted with your password, never in plain text.</p>
<p id="msg"></p>
<form id="f">
  <label>GitHub owner (user or organisation)</label><input id="owner" required>
  <label>Repository name</label><input id="repo" required>
  <div class="grid3" style="grid-template-columns:1fr 1fr">
    <div><label>Branch</label><input id="branch" value="main" required></div>
    <div><label>Folder in repo</label><input id="folder" placeholder="e.g. display/"></div>
  </div>
  <label>GitHub token (fine-grained, Contents: read and write, this repo only)</label><input id="token" type="password" autocomplete="off" required>
  <label>Login password (12+ characters)</label><input id="pw" type="password" autocomplete="new-password" required>
  <label>Confirm password</label><input id="pw2" type="password" autocomplete="new-password" required>
  <p><button id="go">Save and finish</button></p>
</form>
</div></div>
<script src="abb.js"></script>
<script>
const $ = id => document.getElementById(id), msg = (t, ok) => $("msg").innerHTML = `<span class="${ok ? "ok" : "bad"}">${ABB.h(t)}</span>`;
$("folder").value = ABB.guessFolder();
fetch("auth.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (r.ok) location.href = "login.html"; });
$("f").onsubmit = async e => {
  e.preventDefault();
  const pw = $("pw").value;
  if (pw.length < 12) return msg("Use at least 12 characters.");
  if (pw !== $("pw2").value) return msg("Passwords do not match.");
  let folder = $("folder").value.trim().replace(/^\/+/, ""); if (folder && !folder.endsWith("/")) folder += "/";
  const s = { owner: $("owner").value.trim(), repo: $("repo").value.trim(), branch: $("branch").value.trim(), folder, token: $("token").value.trim() };
  $("go").disabled = true; msg("Checking token and saving…", true);
  try {
    await ABB.list(s, folder + "data");   // proves the token can read the repo and the folder is right
    const auth = { owner: s.owner, repo: s.repo, branch: s.branch, folder, created: new Date().toISOString(), token: await ABB.encrypt(s.token, pw) };
    await ABB.writeFile(s, folder + "admin/auth.json", JSON.stringify(auth, null, 2), "AdBreakBox: set up admin login");
    ABB.setSession(s);
    msg("Done. GitHub Pages takes about a minute to publish, then the login page will work.", true);
    setTimeout(() => location.href = "index.html", 1500);
  } catch (err) {
    msg(err.status === 404 ? "Couldn't find the data folder. Check owner, repo, branch and folder." :
        err.status === 401 || err.status === 403 ? "GitHub rejected the token. It needs Contents read and write on this repo." : err.message);
    $("go").disabled = false;
  }
};
</script></body></html>
